services:
  db:
    image: postgres:18.0
    environment:
      POSTGRES_PASSWORD: devpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:8.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build: { context: ./api }
    user: "1654:1654"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${API_PORT:-8080}:8080"]
  worker:
    build: { context: ./worker }
    user: "1654:1654"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  pgdata:
